CorrelationId:
  description: Identificador de correlação da requisição (o enviado pelo cliente ou um gerado pelo servidor).
  schema:
    type: string
Location:
  description: URI do recurso criado.
  schema:
    type: string
    format: uri-reference
RetryAfter:
  description: Segundos até a próxima tentativa.
  schema:
    type: integer
    minimum: 0
