login:
  post:
    tags: [auth]
    operationId: login
    summary: Autentica um usuário
    description: Troca credenciais por access token e refresh token. Rota pública, com rate limit por IP e por conta.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/LoginRequest
    responses:
      '200':
        description: Autenticado.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/TokenResponse
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        description: Credenciais inválidas.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
refresh:
  post:
    tags: [auth]
    operationId: renovarToken
    summary: Renova o access token
    description: |
      Rotaciona o refresh token: devolve um novo par e invalida o anterior. Uma janela curta de tolerância
      aceita o token recém-rotacionado (renovação concorrente ou retry); reuso fora dela revoga a família
      de tokens. Rota pública.
    security: []
    parameters:
      - name: X-Device-Token
        in: header
        required: false
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/RefreshRequest
    responses:
      '200':
        description: Novo par de tokens.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/TokenResponse
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
loginPin:
  post:
    tags: [auth]
    operationId: loginPin
    summary: Autentica um funcionário com PIN em dispositivo autorizado
    description: Rota pública com limite por IP, conta e dispositivo.
    security: []
    parameters:
      - name: X-Device-Token
        in: header
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/LoginPinRequest
    responses:
      '200':
        description: Autenticado.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/TokenResponse
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        description: Credenciais inválidas.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
trocarPin:
  post:
    tags: [auth]
    operationId: trocarPin
    summary: Troca o PIN do funcionário autenticado
    description: Permite que o GARCOM ou a COPA altere o próprio PIN.
    x-roles: [GARCOM, COPA]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/TrocarPinRequest
    responses:
      '204':
        description: PIN alterado; as sessões de refresh anteriores foram revogadas.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '422':
        description: PIN atual incorreto (`PIN_ATUAL_INVALIDO`).
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
logout:
  post:
    tags: [auth]
    operationId: encerrarSessao
    summary: Encerra a sessão
    description: Revoga a família do refresh token informado.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/RefreshRequest
    responses:
      '204':
        description: Sessão encerrada.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '400':
        $ref: ../components/responses.yaml#/BadRequest
