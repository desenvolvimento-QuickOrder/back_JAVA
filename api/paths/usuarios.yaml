colecao:
  get:
    tags: [usuarios]
    operationId: listarUsuarios
    summary: Lista usuários
    x-roles: [ADMIN]
    parameters:
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/Size
      - name: papel
        in: query
        required: false
        schema:
          $ref: ../components/schemas/usuario.yaml#/Papel
      - name: ativo
        in: query
        required: false
        schema:
          type: boolean
    responses:
      '200':
        description: Página de usuários.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/usuario.yaml#/UsuarioPage
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags: [usuarios]
    operationId: criarUsuario
    summary: Cria um usuário
    description: |
      ADMIN exige login e senha. GARCOM e COPA exigem PIN e não aceitam login ou senha.
      Funcionários recebem um código exclusivo do restaurante, nunca reutilizado.
    x-roles: [ADMIN]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/usuario.yaml#/UsuarioCriacao
    responses:
      '201':
        description: Usuário criado.
        headers:
          Location:
            $ref: ../components/headers.yaml#/Location
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/usuario.yaml#/Usuario
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '409':
        description: Login duplicado ou colisão persistente de código (`LOGIN_JA_EXISTE` ou `CODIGO_JA_EXISTE`).
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
      '422':
        description: Não há códigos de funcionário disponíveis (`CODIGOS_ESGOTADOS`).
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
item:
  parameters:
    - $ref: ../components/parameters.yaml#/UsuarioId
  get:
    tags: [usuarios]
    operationId: obterUsuario
    summary: Obtém um usuário
    x-roles: [ADMIN]
    responses:
      '200':
        description: Usuário.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/usuario.yaml#/Usuario
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
  patch:
    tags: [usuarios]
    operationId: atualizarUsuario
    summary: Atualiza um usuário (parcial)
    description: Redefinir o PIN de um funcionário revoga suas sessões e exige troca no próximo login.
    x-roles: [ADMIN]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/usuario.yaml#/UsuarioAtualizacao
    responses:
      '200':
        description: Usuário atualizado.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/usuario.yaml#/Usuario
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Conflito de versão (`CONFLITO_DE_VERSAO`).
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
      '422':
        description: Regra de negócio violada (`TROCA_DE_PAPEL_NAO_PERMITIDA` ou `SENHA_ATUAL_INVALIDA`).
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
desativar:
  parameters:
    - $ref: ../components/parameters.yaml#/UsuarioId
  post:
    tags: [usuarios]
    operationId: desativarUsuario
    summary: Desativa um usuário
    description: Impede novos logins e revoga os refresh tokens do usuário. Idempotente.
    x-roles: [ADMIN]
    responses:
      '200':
        description: Usuário desativado.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/usuario.yaml#/Usuario
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        description: Regra violada, por exemplo desativar o último ADMIN do restaurante (`ULTIMO_ADMIN`).
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/common.yaml#/Problem
ativar:
  parameters:
    - $ref: ../components/parameters.yaml#/UsuarioId
  post:
    tags: [usuarios]
    operationId: ativarUsuario
    summary: Reativa um usuário
    description: Idempotente.
    x-roles: [ADMIN]
    responses:
      '200':
        description: Usuário ativo.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/usuario.yaml#/Usuario
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
