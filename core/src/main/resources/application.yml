# Valores padrão servem só para desenvolvimento local; em outros ambientes tudo vem de variáveis.
spring:
  application:
    name: quickorder-core
  threads:
    virtual:
      enabled: true
  # A aplicação conecta com o papel restrito (sem BYPASSRLS, não é dono das tabelas).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quickorder}
    username: ${DB_APP_USER:quickorder_app}
    password: ${DB_APP_PASSWORD:quickorder_app_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  # O Flyway roda com o dono do schema.
  flyway:
    user: ${DB_MIGRATION_USER:quickorder}
    password: ${DB_MIGRATION_PASSWORD:quickorder}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: logstash

quickorder:
  senha:
    pepper: ${QUICKORDER_SENHA_PEPPER:}
  jwt:
    issuer: https://quickorder
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    key-id: ${JWT_KEY_ID:}
    previous-public-key-location: ${JWT_PREVIOUS_PUBLIC_KEY_LOCATION:}
    previous-key-id: ${JWT_PREVIOUS_KEY_ID:}
  bootstrap:
    slug: ${QUICKORDER_BOOTSTRAP_SLUG:}
    admin-login: ${QUICKORDER_BOOTSTRAP_ADMIN_LOGIN:}
    admin-senha: ${QUICKORDER_BOOTSTRAP_ADMIN_SENHA:}
  cors:
    origens: ${QUICKORDER_CORS_ORIGINS:}
  proxy:
    posicao-ip-da-direita: ${QUICKORDER_PROXY_POSICAO_IP_DA_DIREITA:0}
  seguranca:
    guarda-papel:
      habilitada: ${QUICKORDER_GUARDA_PAPEL_HABILITADA:true}
